git:
  pagers:
    - colorArg: always
      # gruvbox-dark friendly delta colors (default greens/blues are too dim)
      pager: >-
        delta --dark --paging=never --minus-style='syntax #5c2223' --minus-emph-style='syntax #8f2f2f' --plus-style='syntax #2f4a1e' --plus-emph-style='syntax #47702a' --file-style='bold #fabd2f' --file-decoration-style='#fabd2f ul' --hunk-header-style='bold #8ec07c' --hunk-header-decoration-style='#665c54 box'

os:
  # `o` opens the file in nvim in a new tmux pane to the right
  open: 'tmux split-window -h -c "$PWD" nvim -- {{filename}}'

customCommands:
  # `<c-r>` on a file: turn a review remark into a rule in the repo docs (needs the repo's `remember` skill)
  - key: "<c-r>"
    context: "files"
    description: "Claude: remember rule"
    prompts:
      - type: "input"
        title: "Rule"
        key: "Rule"
    command: >-
      claude -p --permission-mode acceptEdits
      {{ printf "/remember %s (from: %s)" .Form.Rule .SelectedPath | quote }} < /dev/null
    loadingText: "Claude is writing the rule..."
    output: popup
